# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
site: Lit
title: Lit - Poetry & Literary Verses
tagline: Poetry, literary verses, and creative writing
description: A collection of poetry, literary verses, and creative writing. Exploring themes of identity, technology, philosophy, and human experience.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://lit.anbuu.in" # the base hostname & protocol for your site, e.g. http://example.com
icon: /assets/images/icon-512.png
twitter_username: anbarasiu
github_username:  anbarasiu
hide_search: true
google_analytics: true

# Author information
author:
  name: Anbarasi U
  email: hi@anbuu.in
  twitter: anbarasiu

# Social media and SEO
social:
  name: Lit
  links:
    - https://lit.anbuu.in

twitter:
  username: anbarasiu
  card: summary_large_image

# SEO keywords
keywords: poetry, literary writing, creative writing, contemporary poetry, philosophical poetry, translations, verses

# Default images for social sharing
image: /assets/images/icon-512.png
logo: /favicon.ico

# Build settings
markdown: kramdownpswd

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 20
paginate_path: "/page/:num/"